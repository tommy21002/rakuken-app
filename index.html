<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<!-- 文字やボタンの大きさは GAS 時代の表示幅（約980px を縮小表示）前提なので、同じ見た目にする -->
<meta name="viewport" content="width=980">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>楽券管理</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, 'Hiragino Sans', sans-serif; background: #f2f2f7; font-size: 48px; }
  .header {
    background: #fff; padding: 16px 22px 0;
    border-bottom: 1px solid #e0e0e0;
    position: sticky; top: 0; z-index: 10;
  }
  .header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .header-title { font-size: 60px; font-weight: 700; color: #1a1a1a; }
  .header-subtitle { font-size: 24px; color: #888; margin-top: 4px; }
  .total-badge { background: #bf0000; color: #fff; border-radius: 12px; padding: 7px 18px; font-size: 30px; font-weight: 600; }
  .summary { display: flex; gap: 12px; padding: 14px 22px; overflow-x: auto; scrollbar-width: none; }
  .summary::-webkit-scrollbar { display: none; }
  .summary-card { flex-shrink: 0; background: #fff; border-radius: 18px; padding: 14px 24px; display: flex; flex-direction: column; align-items: center; min-width: 110px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .summary-num { font-size: 60px; font-weight: 700; }
  .summary-label { font-size: 22px; color: #888; margin-top: 4px; }
  .red { color: #d32f2f; }
  .orange { color: #e65100; }
  .green { color: #2e7d32; }
  .filter-row { display: flex; gap: 12px; padding: 12px 22px; overflow-x: auto; scrollbar-width: none; }
  .filter-row::-webkit-scrollbar { display: none; }
  .filter-chip { flex-shrink: 0; background: #f0f0f5; border: none; border-radius: 24px; padding: 11px 28px; font-size: 34px; font-weight: 500; color: #555; cursor: pointer; }
  .filter-chip.active { background: #bf0000; color: #fff; }
  .list { padding: 12px 18px 320px; display: flex; flex-direction: column; gap: 12px; }
  .card { background: #fff; border-radius: 14px; box-shadow: 0 1px 4px rgba(0,0,0,.08); overflow: hidden; }
  .card-inner { display: flex; align-items: stretch; }
  .card-left-bar { width: 6px; flex-shrink: 0; border-radius: 14px 0 0 14px; }
  .bar-red    { background: #d32f2f; }
  .bar-orange { background: #ff6f00; }
  .bar-yellow { background: #fbc02d; }
  .bar-gray   { background: #9e9e9e; }
  .card-left-info { padding: 18px 16px; flex: 1; }
  .brand-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .brand { font-size: 46px; font-weight: 600; color: #1a1a1a; }
  .acct-badge { font-size: 28px; font-weight: 700; border-radius: 8px; padding: 4px 14px; flex-shrink: 0; }
  .acct-1 { background: #e3f2fd; color: #1565c0; }
  .acct-2 { background: #fce4ec; color: #ad1457; }
  .acct-3 { background: #e8f5e9; color: #2e7d32; }
  .acct-4 { background: #fff8e1; color: #e65100; }
  .acct-other { background: #f3e5f5; color: #6a1b9a; }
  .no-link-badge { font-size: 11px; background: #fff3cd; color: #856404; padding: 2px 7px; border-radius: 6px; }
  .amount-row { margin-top: 3px; display: flex; align-items: baseline; gap: 4px; }
  .amount { font-size: 60px; font-weight: 700; color: #1a1a1a; }
  .yen { font-size: 30px; color: #555; }
  .expiry-row { margin-top: 10px; display: flex; align-items: center; gap: 12px; }
  .expiry-date { font-size: 28px; color: #666; }
  .days-badge { font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 8px; }
  .days-red    { background: #ffebee; color: #c62828; }
  .days-orange { background: #fff3e0; color: #e65100; }
  .days-yellow { background: #fffde7; color: #f57f17; }
  .days-gray   { background: #f5f5f5; color: #616161; }
  .card-actions { display: flex; gap: 12px; padding: 0 18px 18px 18px; }
  .btn-use { flex: 2; background: #bf0000; color: #fff; border: none; border-radius: 16px; padding: 22px 0; font-size: 36px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .btn-use:active { opacity: .8; }
  .btn-use:disabled { background: #9e9e9e; cursor: default; }
  .btn-nolink { flex: 2; background: #e8f0fe; color: #1a73e8; border: none; border-radius: 16px; padding: 22px 0; font-size: 36px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .btn-nolink:active { opacity: .8; }
  .btn-done { flex: 1; background: #f5f5f5; color: #555; border: none; border-radius: 16px; padding: 22px 0; font-size: 33px; font-weight: 500; cursor: pointer; text-align: center; white-space: nowrap; }
  .btn-done:active { background: #e0e0e0; }
  .btn-done:disabled { opacity: .5; cursor: default; }
  .btn-undo { flex: 1; background: #fff3e0; color: #e65100; border: none; border-radius: 16px; padding: 22px 0; font-size: 33px; font-weight: 600; cursor: pointer; text-align: center; white-space: nowrap; }
  .btn-undo:active { background: #ffe0b2; }
  .btn-undo:disabled { opacity: .5; cursor: default; }
  .card.used { opacity: .55; background: #f5f5f5; }
  .card.used .brand { color: #888; text-decoration: line-through; }
  .card.used .amount { color: #aaa; }
  .section-label { font-size: 12px; font-weight: 600; color: #888; padding: 10px 0 4px; }
  .section-label-used { font-size: 12px; font-weight: 600; color: #aaa; padding: 18px 0 4px; border-top: 1px solid #e0e0e0; margin-top: 6px; }
  .fab { position: fixed; bottom: 30px; right: 24px; width: 140px; height: 140px; border-radius: 50%; background: #bf0000; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 56px; box-shadow: 0 6px 20px rgba(0,0,0,.3); cursor: pointer; z-index: 20; border: none; }
  .fab-settings { position: fixed; bottom: 190px; right: 24px; width: 140px; height: 140px; border-radius: 50%; background: #fff; color: #555; display: flex; align-items: center; justify-content: center; font-size: 56px; box-shadow: 0 3px 10px rgba(0,0,0,.2); cursor: pointer; z-index: 20; border: 2px solid #e0e0e0; }
  .search-wrap { padding: 4px 12px 8px; }
  .search-input { width: 100%; background: #f0f0f5; border: none; border-radius: 10px; padding: 9px 14px; font-size: 14px; outline: none; color: #333; }
  .toast { position: fixed; bottom: 140px; left: 50%; transform: translateX(-50%); background: #323232; color: #fff; border-radius: 8px; padding: 18px 24px; font-size: 28px; z-index: 100; opacity: 0; transition: opacity .3s; }
  .toast.show { opacity: 1; }
  .loading { text-align: center; color: #888; padding: 40px 0; font-size: 14px; }
  .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.45); z-index: 50; flex-direction: column; justify-content: flex-end; }
  .modal-overlay.show { display: flex; }
  .modal-sheet { background: #fff; border-radius: 28px 28px 0 0; padding: 36px 28px 56px; width: 100%; }
  .modal-title { font-size: 34px; font-weight: 700; color: #1a1a1a; margin-bottom: 28px; text-align: center; }
  .modal-btn { width: 100%; background: #f5f5f5; color: #1a1a1a; border: none; border-radius: 18px; padding: 28px 28px; font-size: 30px; font-weight: 500; cursor: pointer; text-align: left; margin-bottom: 16px; display: flex; align-items: center; gap: 18px; }
  .modal-btn:active { background: #e0e0e0; }
  .modal-btn:disabled { opacity: .5; cursor: default; }
  .modal-btn-danger { color: #bf0000; }
  .modal-close { width: 100%; background: none; border: none; border-top: 1px solid #e8e8e8; padding: 28px; font-size: 30px; color: #888; cursor: pointer; margin-top: 8px; }
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div>
      <div class="header-title">🎫 楽券管理</div>
      <div class="header-subtitle" id="subtitle">読み込み中…</div>
    </div>
    <span class="total-badge" id="total-badge">–</span>
  </div>
</div>

<div class="summary">
  <div class="summary-card">
    <span class="summary-num red" id="sum-30">–</span>
    <span class="summary-label">30日以内</span>
  </div>
  <div class="summary-card">
    <span class="summary-num orange" id="sum-60">–</span>
    <span class="summary-label">60日以内</span>
  </div>
  <div class="summary-card">
    <span class="summary-num" style="color:#1a1a1a" id="sum-total">–</span>
    <span class="summary-label">未使用</span>
  </div>
  <div class="summary-card">
    <span class="summary-num green" id="sum-amount">–</span>
    <span class="summary-label">残高合計</span>
  </div>
</div>

<div class="filter-row">
  <button class="filter-chip active" data-acct="" onclick="setFilter(this)">全て</button>
  <button class="filter-chip" data-acct="1" onclick="setFilter(this)">1</button>
  <button class="filter-chip" data-acct="2" onclick="setFilter(this)">2</button>
  <button class="filter-chip" data-acct="3" onclick="setFilter(this)">3</button>
  <button class="filter-chip" data-acct="4" onclick="setFilter(this)">4</button>
</div>

<div class="search-wrap">
  <input class="search-input" placeholder="🔍  ブランドを検索…" id="search-input" oninput="applyFilters()">
</div>

<div class="list" id="list">
  <div class="loading">読み込み中…</div>
</div>

<button class="fab-settings" onclick="openSettings()">⚙️</button>
<button class="fab" onclick="loadVouchers()" title="更新">↻</button>
<div class="toast" id="toast"><span id="toast-msg"></span></div>

<div class="modal-overlay" id="modal-overlay" onclick="closeSettings(event)">
  <div class="modal-sheet" onclick="event.stopPropagation()">
    <div class="modal-title">操作メニュー</div>
    <button class="modal-btn" id="btn-scan" onclick="runScanEmails()">
      <span>📧</span><span>メールをスキャンしてURLを取得</span>
    </button>
    <button class="modal-close" onclick="closeSettings()">閉じる</button>
  </div>
</div>

<script>
// 2026-11-24〜 GitHub Pages 版。データは GAS（API）から人ごとの合言葉で読み書きする
// 合言葉はページに書かない: 最初に URL の #k=… で開くと、この端末に覚える（以後は #k なしでも開ける）
var API = 'https://script.google.com/macros/s/AKfycbzFod4vfUaqKfvc49ljUaTSXSIWXTmK2Z07UitNwAsaZA9uGWj-BcydXVP-o2i7PrF1/exec';
var K = (function () {
  var m = location.hash.match(/k=([^&]+)/);
  try {
    if (m) {
      localStorage.setItem('rakuken_k', m[1]);
      history.replaceState(null, '', location.pathname);  // 合言葉をアドレス欄から消す
      return m[1];
    }
    return localStorage.getItem('rakuken_k') || '';
  } catch (_) { return m ? m[1] : ''; }
})();
function api_(body) {
  if (!K) return Promise.reject(new Error('合言葉付きのリンクで一度開いてください'));
  body.appKey = K;
  // Content-Type を付けない（単純な送信にして事前確認の通信を起こさない）
  var once = function () {
    return fetch(API, { method: 'POST', body: JSON.stringify(body) })
      .then(function (r) { if (!r.ok) throw new Error('通信エラー ' + r.status); return r.json(); });
  };
  // GAS は時々 404 やエラー画面を返すので、通信の失敗だけ最大4回まで送り直す（どの操作も2回送って同じ結果）
  var tryN = function (n) {
    return once().catch(function (e) {
      if (n >= 4) throw new Error('通信に失敗しました（' + e.message + '）。↻を押してください');
      return new Promise(function (res) { setTimeout(res, 800 * n); }).then(function () { return tryN(n + 1); });
    });
  };
  return tryN(1).then(function (j) {
    if (j && j.message === 'unauthorized') throw new Error('合言葉が違います。もらったリンクで開き直してください');
    return j;
  });
}

var _vouchers = [];
var _filterAcct = '';

function today0() {
  var d = new Date();
  d.setHours(0,0,0,0);
  return d;
}

function parseExpiry(s) {
  if (!s) return null;
  var d = new Date(String(s).replace(/\//g,'-'));
  d.setHours(0,0,0,0);
  return isNaN(d.getTime()) ? null : d;
}

function daysLeft(expiry) {
  var e = parseExpiry(expiry);
  if (!e) return 9999;
  return Math.round((e - today0()) / 86400000);
}

function barClass(d) {
  if (d <= 7) return 'bar-red';
  if (d <= 30) return 'bar-orange';
  if (d <= 60) return 'bar-yellow';
  return 'bar-gray';
}

function badgeClass(d) {
  if (d <= 7) return 'days-red';
  if (d <= 30) return 'days-orange';
  if (d <= 60) return 'days-yellow';
  return 'days-gray';
}

function badgeText(d) {
  if (d < 0) return '期限切れ';
  if (d === 0) return '本日期限';
  return 'あと' + d + '日';
}

function isNoLink(url) {
  return !url || url.indexOf('/myrakken/email/') !== -1 || url === '' || url === 'undefined';
}

function acctClass(a) {
  if (a === '1') return 'acct-1';
  if (a === '2') return 'acct-2';
  if (a === '3') return 'acct-3';
  if (a === '4') return 'acct-4';
  return 'acct-other';
}

function sectionKey(v) {
  var d = daysLeft(v.expiry);
  var e = parseExpiry(v.expiry);
  if (d < 0) return '00_expired';
  if (d <= 7) return '01_week';
  if (d <= 30) return '02_month';
  if (!e) return '99_other';
  var ym = e.getFullYear() * 100 + (e.getMonth() + 1);
  return '10_' + ym;
}

function sectionTitle(key) {
  if (key === '00_expired') return '⚠️ 期限切れ';
  if (key === '01_week') return '🔴 残り7日以内';
  if (key === '02_month') return '⚡ 残り30日以内';
  if (key === '99_other') return 'その他';
  var ym = parseInt(key.slice(3));
  return '📅 ' + Math.floor(ym/100) + '年' + (ym%100) + '月';
}

function makeEl(tag, cls) {
  var el = document.createElement(tag);
  if (cls) el.className = cls;
  return el;
}

function makeCard(v, idx) {
  var d = daysLeft(v.expiry);
  var noLink = isNoLink(v.url);
  var acct = String(v.account || '').trim();

  var card = makeEl('div', v.used ? 'card used' : 'card');
  card.dataset.brand = v.brand;
  card.dataset.acct = acct;
  card.dataset.used = v.used ? '1' : '0';

  var inner = makeEl('div', 'card-inner');
  var bar = makeEl('div', 'card-left-bar ' + (v.used ? 'bar-gray' : barClass(d)));
  inner.appendChild(bar);

  var info = makeEl('div', 'card-left-info');

  var brandRow = makeEl('div', 'brand-row');
  var brandEl = makeEl('span', 'brand');
  brandEl.textContent = v.brand;
  brandRow.appendChild(brandEl);

  if (acct) {
    var acctEl = makeEl('span', 'acct-badge ' + acctClass(acct));
    acctEl.textContent = acct;
    brandRow.appendChild(acctEl);
  }
  if (!v.used && noLink) {
    var nlEl = makeEl('span', 'no-link-badge');
    nlEl.textContent = 'リンク未取得';
    brandRow.appendChild(nlEl);
  }
  info.appendChild(brandRow);

  var amtRow = makeEl('div', 'amount-row');
  var amtEl = makeEl('span', 'amount');
  amtEl.textContent = Number(v.amount).toLocaleString();
  var yenEl = makeEl('span', 'yen');
  yenEl.textContent = '円';
  amtRow.appendChild(amtEl);
  amtRow.appendChild(yenEl);
  info.appendChild(amtRow);

  if (v.expiry) {
    var expRow = makeEl('div', 'expiry-row');
    var expDate = makeEl('span', 'expiry-date');
    expDate.textContent = v.expiry;
    expRow.appendChild(expDate);
    if (!v.used) {
      var daysBadge = makeEl('span', 'days-badge ' + badgeClass(d));
      daysBadge.textContent = badgeText(d);
      expRow.appendChild(daysBadge);
    }
    info.appendChild(expRow);
  }

  inner.appendChild(info);
  card.appendChild(inner);

  var actions = makeEl('div', 'card-actions');

  if (v.used) {
    var btnUsed = makeEl('button', 'btn-use');
    btnUsed.textContent = '✓ 使用済み';
    btnUsed.disabled = true;
    actions.appendChild(btnUsed);
    var btnUndo = makeEl('button', 'btn-undo');
    btnUndo.textContent = '↩ 戻す';
    btnUndo.onclick = (function(url, b) { return function() { markUnused(url, b); }; })(v.url, btnUndo);
    actions.appendChild(btnUndo);
  } else if (noLink) {
    var btnNoLink = makeEl('button', 'btn-nolink');
    btnNoLink.textContent = '📧 楽天で確認';
    btnNoLink.onclick = (function(url) { return function() { if (url && url !== 'undefined') window.open(url, '_blank'); else showToast('URLが設定されていません'); }; })(v.url);
    actions.appendChild(btnNoLink);
    var btnDone2 = makeEl('button', 'btn-done');
    btnDone2.textContent = '✓ 使った';
    btnDone2.onclick = (function(url, btn) { return function() { markUsed(url, btn); }; })(v.url, btnDone2);
    actions.appendChild(btnDone2);
  } else {
    var btnUse = makeEl('button', 'btn-use');
    btnUse.textContent = '🎫 楽券を使う';
    btnUse.onclick = (function(url) { return function() { openVoucher(url); }; })(v.url);
    actions.appendChild(btnUse);
    var btnDone = makeEl('button', 'btn-done');
    btnDone.textContent = '✓ 使った';
    btnDone.onclick = (function(url, btn) { return function() { markUsed(url, btn); }; })(v.url, btnDone);
    actions.appendChild(btnDone);
  }

  card.appendChild(actions);
  return card;
}

function setFilter(chip) {
  document.querySelectorAll('.filter-chip').forEach(function(c) { c.classList.remove('active'); });
  chip.classList.add('active');
  _filterAcct = chip.dataset.acct;
  applyFilters();
}

function applyFilters() {
  var q = document.getElementById('search-input').value.trim();
  var cards = document.querySelectorAll('#list .card');
  cards.forEach(function(card) {
    var brand = card.dataset.brand || '';
    var acct = card.dataset.acct || '';
    var matchSearch = q === '' || brand.indexOf(q) !== -1;
    var matchAcct = _filterAcct === '' || acct === _filterAcct;
    card.style.display = (matchSearch && matchAcct) ? '' : 'none';
  });

  var listEl = document.getElementById('list');
  var children = listEl.children;
  for (var i = 0; i < children.length; i++) {
    var cls = children[i].className;
    if (cls !== 'section-label' && cls !== 'section-label-used') continue;
    var hasVisible = false;
    for (var j = i + 1; j < children.length; j++) {
      var jcls = children[j].className;
      if (jcls === 'section-label' || jcls === 'section-label-used') break;
      if ((children[j].classList.contains('card')) && children[j].style.display !== 'none') {
        hasVisible = true;
        break;
      }
    }
    children[i].style.display = hasVisible ? '' : 'none';
  }
}

function renderVouchers(vouchers) {
  _vouchers = vouchers;
  var active = vouchers.filter(function(v) { return !v.used; });
  var c30 = 0, c60 = 0, total = 0;
  active.forEach(function(v) {
    var d = daysLeft(v.expiry);
    if (d <= 30) c30++;
    if (d <= 60) c60++;
    total += Number(v.amount) || 0;
  });

  document.getElementById('sum-30').textContent = c30;
  document.getElementById('sum-60').textContent = c60;
  document.getElementById('sum-total').textContent = active.length;
  document.getElementById('sum-amount').textContent = '¥' + total.toLocaleString();
  document.getElementById('total-badge').textContent = active.length + '枚';

  var now = new Date();
  document.getElementById('subtitle').textContent =
    now.getFullYear() + '/' + String(now.getMonth()+1).padStart(2,'0') + '/' + String(now.getDate()).padStart(2,'0') + ' 現在';

  var sorted = vouchers.slice().sort(function(a, b) {
    if (a.used !== b.used) return a.used ? 1 : -1;
    var da = parseExpiry(a.expiry) || new Date(9999,0,1);
    var db = parseExpiry(b.expiry) || new Date(9999,0,1);
    if (da - db !== 0) return da - db;
    return String(a.brand).localeCompare(String(b.brand), 'ja');
  });

  var list = document.getElementById('list');
  while (list.firstChild) list.removeChild(list.firstChild);

  // 未使用アイテム（セクション分け）
  var lastSection = null;
  var hasActive = false;
  sorted.forEach(function(v) {
    if (v.used) return;
    hasActive = true;
    var sec = sectionKey(v);
    if (sec !== lastSection) {
      lastSection = sec;
      var lbl = makeEl('div', 'section-label');
      lbl.textContent = sectionTitle(sec);
      list.appendChild(lbl);
    }
    list.appendChild(makeCard(v));
  });

  if (!hasActive) {
    var empty = makeEl('div', 'loading');
    empty.textContent = '未使用の楽券はありません';
    list.appendChild(empty);
  }

  // 使用済みアイテム（グレーアウト表示）
  var usedItems = sorted.filter(function(v) { return v.used; });
  if (usedItems.length > 0) {
    var usedLbl = makeEl('div', 'section-label-used');
    usedLbl.textContent = '✓ 使用済み（シートで手動削除してください）';
    list.appendChild(usedLbl);
    usedItems.forEach(function(v) {
      list.appendChild(makeCard(v));
    });
  }

  applyFilters();
}

function openVoucher(url) {
  if (!url || url === '' || url === 'undefined') { showToast('URLが設定されていません'); return; }
  window.open(url, '_blank');
}

function markUsed(url, btn) {
  var v = _vouchers.find(function(x) { return x.url === url; });
  if (!v) return;
  btn.disabled = true;
  btn.textContent = '送信中…';
  api_({ action: 'appMarkUsed', url: url })
    .then(function(result) {
      if (result && result.status === 'ok') {
        v.used = true;
        renderVouchers(_vouchers);
        showToast('使用済みにしました（シートもグレーになります）');
      } else {
        btn.disabled = false;
        btn.textContent = '✓ 使った';
        showToast('更新に失敗しました');
      }
    })
    .catch(function(err) {
      btn.disabled = false;
      btn.textContent = '✓ 使った';
      showToast(err && err.message ? err.message : 'エラーが発生しました');
    });
}

function markUnused(url, btn) {
  var v = _vouchers.find(function(x) { return x.url === url; });
  if (!v) return;
  btn.disabled = true;
  btn.textContent = '戻し中…';
  api_({ action: 'appMarkUnused', url: url })
    .then(function(result) {
      if (result && result.status === 'ok') {
        v.used = false;
        renderVouchers(_vouchers);
        showToast('未使用に戻しました');
      } else {
        btn.disabled = false;
        btn.textContent = '↩ 戻す';
        showToast('元に戻せませんでした');
      }
    })
    .catch(function(err) {
      btn.disabled = false;
      btn.textContent = '↩ 戻す';
      showToast(err && err.message ? err.message : 'エラーが発生しました');
    });
}

function loadVouchers() {
  var list = document.getElementById('list');
  while (list.firstChild) list.removeChild(list.firstChild);
  var loading = document.createElement('div');
  loading.className = 'loading';
  loading.textContent = '読み込み中…';
  list.appendChild(loading);
  document.getElementById('search-input').value = '';

  api_({ action: 'appList' })
    .then(function(j) {
      if (!j || j.status !== 'ok') throw new Error((j && j.message) || '読み込みに失敗しました');
      renderVouchers(j.vouchers || []);
    })
    .catch(function(err) {
      loading.textContent = err && err.message ? err.message : '読み込みに失敗しました';
      showToast('エラー: ' + (err && err.message ? err.message : String(err)));
    });
}

function openSettings() {
  document.getElementById('modal-overlay').classList.add('show');
}

function closeSettings(e) {
  if (!e || e.target === document.getElementById('modal-overlay')) {
    document.getElementById('modal-overlay').classList.remove('show');
  }
}

function runScanEmails() {
  var btn = document.getElementById('btn-scan');
  var label = btn.querySelector('span:last-child');
  btn.disabled = true;
  label.textContent = 'スキャン中…';
  api_({ action: 'appScanEmails' })
    .then(function(result) {
      btn.disabled = false;
      label.textContent = 'メールをスキャンしてURLを取得';
      closeSettings();
      var n = (result && result.updated != null) ? result.updated : '?';
      showToast(n + '件のURLを更新しました');
      if (result && result.updated > 0) loadVouchers();
    })
    .catch(function() {
      btn.disabled = false;
      label.textContent = 'メールをスキャンしてURLを取得';
      showToast('スキャンに失敗しました');
    });
}

function showToast(msg) {
  var t = document.getElementById('toast');
  document.getElementById('toast-msg').textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(function() { t.classList.remove('show'); }, 2500);
}

window.onload = loadVouchers;
</script>

</body>
</html>
