<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<!-- 文字やボタンの大きさは GAS 時代の表示幅（約980px を縮小表示）前提なので、同じ見た目にする -->
<meta name="viewport" content="width=980">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>ミデア補給便</title>
<style>
  :root {
    color-scheme: dark;
    --hull: #0b1422;
    --panel: #17283b;
    --panel-raised: #20364c;
    --line: #456079;
    --text: #f0f6fc;
    --muted: #b6c9da;
    --blue: #185fc0;
    --yellow: #f5ce58;
    --red: #ff858b;
    --orange: #ffb36e;
    --cut: polygon(0 0, calc(100% - 20px) 0, 100% 20px, 100% 100%, 20px 100%, 0 calc(100% - 20px));
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: var(--hull); }
  body {
    min-width: 980px;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
    font-size: 32px;
    line-height: 1.5;
    color: var(--text);
    background:
      linear-gradient(rgba(115, 161, 197, .045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(115, 161, 197, .045) 1px, transparent 1px),
      var(--hull);
    background-size: 48px 48px;
    -webkit-text-size-adjust: 100%;
  }
  button, input { font: inherit; }
  button { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  button:focus-visible, input:focus-visible {
    outline: 4px solid var(--yellow);
    outline-offset: -6px;
  }
  button { transition: background-color .15s, border-color .15s; }
  .header {
    position: sticky; top: 0; z-index: 10;
    padding: 28px 28px 22px;
    background: #142337;
    border-bottom: 2px solid #637f98;
    box-shadow: 0 10px 28px #050b1480;
  }
  .header::before {
    content: ""; position: absolute; top: 0; left: 0; right: 0; height: 6px;
    background: linear-gradient(90deg, #eaf3fa 0 62%, #2778d8 62% 85%, #cc404b 85% 94%, #f5ce58 94%);
  }
  .header-top { display: flex; align-items: center; justify-content: space-between; gap: 20px; }
  .header-title {
    display: flex; align-items: center; gap: 20px;
    font-size: 60px; line-height: 1.2; font-weight: 800; letter-spacing: .015em;
  }
  .header-title::before {
    content: ""; flex: 0 0 54px; height: 62px;
    background: linear-gradient(90deg, #edf6ff 0 40%, #418ce0 40% 60%, #edf6ff 60%);
    clip-path: polygon(50% 0, 100% 26%, 100% 46%, 62% 29%, 62% 65%, 90% 80%, 90% 100%, 50% 79%, 10% 100%, 10% 80%, 38% 65%, 38% 29%, 0 46%, 0 26%);
  }
  .header-subtitle { font-size: 28px; color: var(--muted); margin-top: 10px; padding-left: 74px; }
  .total-badge {
    flex-shrink: 0; padding: 10px 22px; font-size: 32px; font-weight: 800;
    border: 1px solid #7892a9; border-left: 6px solid var(--yellow);
    background: #233b53; color: #fff;
    font-variant-numeric: tabular-nums;
  }
  .summary {
    display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)) minmax(320px, 1.8fr);
    gap: 12px; padding: 24px 24px 16px;
  }
  .summary-card {
    min-width: 0; padding: 18px 12px 16px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: #162639; border: 1px solid var(--line); border-top: 3px solid #6d849a;
    clip-path: polygon(0 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%);
  }
  .summary-card:first-child { border-top-color: var(--red); }
  .summary-card:nth-child(2) { border-top-color: var(--orange); }
  .summary-card:last-child { border-top-color: var(--yellow); background: #20334a; }
  .summary-num { font-size: 60px; line-height: 1.2; font-weight: 800; font-variant-numeric: tabular-nums; }
  .summary-label { font-size: 28px; color: var(--muted); margin-top: 8px; white-space: nowrap; }
  .red { color: var(--red); }
  .orange { color: var(--orange); }
  .green { color: #c8e7ff; }
  /* 元のHTMLにある文字色の直接指定を、暗いパネルでも読める色にする。 */
  #sum-total { color: var(--text) !important; }
  #sum-amount { font-size: 52px; color: #ffe69b; letter-spacing: -.03em; overflow-wrap: anywhere; text-align: center; }
  .filter-row {
    display: flex; gap: 12px; padding: 12px 24px 18px;
    overflow-x: auto; scrollbar-width: none;
  }
  .filter-row::-webkit-scrollbar { display: none; }
  .filter-chip {
    flex-shrink: 0; min-width: 112px; min-height: 76px; padding: 10px 30px;
    border: 1px solid #536d86; border-bottom: 4px solid #536d86; border-radius: 3px;
    background: #1c2e43; color: #c5d5e4; font-size: 34px; font-weight: 700; cursor: pointer;
  }
  .filter-chip.active { background: #edf4fa; color: #152c46; border-color: #edf4fa; border-bottom-color: #387dde; }
  .filter-chip:active { background: #315274; color: white; }
  .search-wrap { padding: 0 24px 12px; }
  .search-input {
    display: block; width: 100%; min-height: 78px; padding: 14px 22px;
    border: 1px solid #59758e; border-left: 5px solid #5e8fb9; border-radius: 3px;
    background: #101f30; color: var(--text); font-size: 30px;
    box-shadow: inset 0 3px 8px #050b1433;
  }
  .search-input::placeholder { color: #a8bed2; opacity: 1; }
  .list { display: flex; flex-direction: column; gap: 18px; padding: 8px 24px 350px; }
  .section-label, .section-label-used {
    display: flex; align-items: center; gap: 16px;
    padding: 16px 0 4px; color: #d0e0ef; font-size: 28px; font-weight: 700;
  }
  .section-label::after, .section-label-used::after {
    content: ""; flex: 1; min-width: 24px; height: 1px; background: #456079;
  }
  .section-label-used { margin-top: 24px; padding-top: 24px; color: #afbdcc; border-top: 2px solid #35485c; }
  .card {
    position: relative; isolation: isolate; overflow: hidden; clip-path: var(--cut);
    border: 1px solid #57718a; border-top: 2px solid #7890a7; border-radius: 0;
    background:
      repeating-linear-gradient(0deg, transparent 0 5px, rgba(201, 224, 245, .018) 5px 6px),
      linear-gradient(115deg, #20364c, #17283b 70%);
  }
  .card::after {
    content: ""; position: absolute; top: 18px; right: 24px;
    width: 42px; height: 6px; border-left: 12px solid #e4edf4; border-right: 12px solid #e1bd56;
    background: #3778b9; pointer-events: none;
  }
  .card-inner { display: flex; align-items: stretch; }
  .card-left-bar {
    position: relative; width: 14px; margin: 20px 0 20px 12px; flex-shrink: 0;
    border: 1px solid #ffffff33; border-radius: 2px;
    box-shadow: inset 0 0 0 3px #0a152655;
  }
  .bar-red { background: var(--red); color: var(--red); }
  .bar-orange { background: var(--orange); color: var(--orange); }
  .bar-yellow { background: var(--yellow); color: var(--yellow); }
  .bar-gray { background: #96a7b8; color: #96a7b8; }
  .card-left-info { flex: 1; min-width: 0; padding: 26px 28px 24px 24px; }
  .brand-row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding-right: 36px; }
  .brand { font-size: 42px; font-weight: 700; line-height: 1.45; color: #f0f6fc; overflow-wrap: anywhere; }
  .acct-badge {
    flex-shrink: 0; padding: 2px 14px; border: 1px solid currentColor; border-radius: 3px;
    font-size: 28px; font-weight: 800; line-height: 1.5;
  }
  .acct-1 { background: #173f64; color: #b4dcff; }
  .acct-2 { background: #4a293e; color: #ffc4da; }
  .acct-3 { background: #1c403c; color: #b0ead9; }
  .acct-4 { background: #493c22; color: #ffe09b; }
  .acct-other { background: #3a2c50; color: #e0c7ff; }
  .no-link-badge { padding: 3px 10px; border: 1px solid #9b8050; border-radius: 3px; background: #473922; color: #ffe1a1; font-size: 28px; }
  .amount-row { display: flex; align-items: baseline; gap: 10px; margin-top: 4px; }
  .amount { font-size: 60px; font-weight: 800; letter-spacing: .01em; font-variant-numeric: tabular-nums; color: #f6faff; }
  .yen { font-size: 30px; color: #bbd0e2; }
  .expiry-row { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; margin-top: 10px; }
  .expiry-date { font-size: 30px; color: #c7d8e7; font-variant-numeric: tabular-nums; }
  .days-badge {
    display: inline-flex; align-items: center; gap: 12px; padding: 4px 14px;
    border: 1px solid currentColor; border-radius: 3px; font-size: 28px; font-weight: 700;
  }
  .days-badge::before {
    content: ""; width: 12px; height: 12px; flex-shrink: 0; border-radius: 50%;
    background: currentColor; box-shadow: 0 0 10px currentColor;
  }
  .days-red { background: #452631; color: #ff9b9f; }
  .days-orange { background: #433124; color: #ffbc83; }
  .days-yellow { background: #3c3824; color: #f5d874; }
  .days-gray { background: #263442; color: #c2cfda; }
  .card-actions { display: flex; gap: 14px; padding: 0 24px 24px 28px; }
  .btn-use, .btn-nolink, .btn-done, .btn-undo {
    min-height: 100px; padding: 20px 16px; border-radius: 3px;
    cursor: pointer; font-size: 34px; line-height: 1.4; font-weight: 700;
  }
  .btn-use, .btn-nolink { display: flex; align-items: center; justify-content: center; gap: 8px; flex: 2; min-width: 0; }
  .btn-use {
    color: #fff; background: #185fc0; border: 2px solid #75b2ff; border-left: 8px solid var(--yellow);
    font-size: 36px; box-shadow: inset 0 1px 0 #c5e2ff66, 0 4px 14px #030c1b55;
  }
  .btn-use:active { background: #104587; }
  .btn-nolink { background: #254563; color: #e0f0ff; border: 1px solid #7398b9; }
  .btn-nolink:active { background: #315779; }
  .btn-done, .btn-undo {
    flex: 1; background: #182a3c; color: #c5d3e0; border: 1px solid #526a80;
    text-align: center; white-space: nowrap; font-weight: 500;
  }
  .btn-done:active, .btn-undo:active { background: #31485e; }
  .btn-use:disabled { color: #aebdcb; background: #253342; border-color: #526172; box-shadow: none; cursor: default; }
  .btn-done:disabled, .btn-undo:disabled, .modal-btn:disabled { opacity: .6; cursor: default; }
  .card.used { background: #131f2c; border-color: #3b4e62; border-top-color: #526173; }
  .card.used::after { opacity: .35; }
  .card.used .brand { color: #afbdcc; text-decoration: line-through; text-decoration-color: #718499; }
  .card.used .amount { color: #a4b3c2; }
  .card.used .yen, .card.used .expiry-date { color: #a7b8c8; }
  .card.used .acct-badge { background: #263442; color: #b7c5d2; border-color: #52677c; }
  .card.used .card-left-bar { background: #627284; }
  .card.used .btn-undo { color: #c5d3e0; background: #1a2b3b; }
  .fab, .fab-settings {
    position: fixed; right: 24px; width: 140px; height: 140px;
    display: flex; align-items: center; justify-content: center; z-index: 20;
    border-radius: 6px; border: 2px solid #91a8bd; cursor: pointer;
    box-shadow: 0 6px 22px #020812aa, inset 0 0 0 5px #0c1929;
  }
  .fab { bottom: 30px; background: #e0eaf3; color: #163857; font-size: 72px; border-bottom: 7px solid #387dde; }
  .fab-settings { bottom: 190px; background: #263b50; color: #e9f2fa; font-size: 56px; }
  .fab:active, .fab-settings:active { background: #42678a; color: white; }
  .toast {
    position: fixed; bottom: 190px; left: 50%; transform: translateX(-50%);
    width: max-content; max-width: calc(100% - 48px); padding: 20px 28px;
    background: #eef4f9; color: #152a40; border-left: 7px solid #d09f26; border-radius: 3px;
    font-size: 30px; font-weight: 600; z-index: 100; opacity: 0; pointer-events: none;
    box-shadow: 0 8px 32px #02081299; transition: opacity .2s;
  }
  .toast.show { opacity: 1; }
  .loading { padding: 44px 24px; font-size: 30px; color: #c0d1e0; text-align: center; }
  .modal-overlay {
    display: none; position: fixed; inset: 0; z-index: 50; background: #030913cc;
    flex-direction: column; justify-content: flex-end;
  }
  .modal-overlay.show { display: flex; }
  .modal-sheet {
    width: 100%; max-height: 90vh; overflow-y: auto;
    padding: 34px 28px max(40px, env(safe-area-inset-bottom));
    border: 2px solid #7089a0; border-top: 6px solid #d8e6f2; border-radius: 0;
    background: #182a3e; box-shadow: 0 -12px 50px #03091380;
  }
  .modal-title { margin-bottom: 28px; color: #f0f6fc; font-size: 36px; font-weight: 700; text-align: center; }
  .modal-btn {
    display: flex; align-items: center; gap: 18px; width: 100%; min-height: 100px;
    margin-bottom: 16px; padding: 26px; border: 1px solid #617e98; border-radius: 3px;
    background: #263f58; color: #eff6fc; font-size: 30px; text-align: left; cursor: pointer;
  }
  .modal-btn:active { background: #355675; }
  .modal-btn-danger { color: #ff9b9f; }
  .modal-close {
    width: 100%; min-height: 96px; margin-top: 8px; padding: 24px;
    background: none; border: 0; border-top: 1px solid #57718a; color: #c6d8e8;
    font-size: 32px; cursor: pointer;
  }
  @media (prefers-reduced-motion: reduce) {
    button, .toast { transition: none; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div>
      <div class="header-title">ミデア補給便</div>
      <div class="header-subtitle" id="subtitle">読み込み中…</div>
    </div>
    <span class="total-badge" id="total-badge">–</span>
  </div>
</div>

<div class="summary">
  <div class="summary-card">
    <span class="summary-num red" id="sum-30">–</span>
    <span class="summary-label">30日以内</span>
  </div>
  <div class="summary-card">
    <span class="summary-num orange" id="sum-60">–</span>
    <span class="summary-label">60日以内</span>
  </div>
  <div class="summary-card">
    <span class="summary-num" style="color:#1a1a1a" id="sum-total">–</span>
    <span class="summary-label">未使用</span>
  </div>
  <div class="summary-card">
    <span class="summary-num green" id="sum-amount">–</span>
    <span class="summary-label">残高合計</span>
  </div>
</div>

<div class="filter-row">
  <button class="filter-chip active" data-acct="" onclick="setFilter(this)">全て</button>
  <button class="filter-chip" data-acct="1" onclick="setFilter(this)">1</button>
  <button class="filter-chip" data-acct="2" onclick="setFilter(this)">2</button>
  <button class="filter-chip" data-acct="3" onclick="setFilter(this)">3</button>
  <button class="filter-chip" data-acct="4" onclick="setFilter(this)">4</button>
</div>

<div class="search-wrap">
  <input class="search-input" placeholder="🔍  ブランドを検索…" id="search-input" oninput="applyFilters()">
</div>

<div class="list" id="list">
  <div class="loading">読み込み中…</div>
</div>

<button class="fab-settings" onclick="openSettings()">⚙️</button>
<button class="fab" onclick="loadVouchers()" title="更新">↻</button>
<div class="toast" id="toast"><span id="toast-msg"></span></div>

<div class="modal-overlay" id="modal-overlay" onclick="closeSettings(event)">
  <div class="modal-sheet" onclick="event.stopPropagation()">
    <div class="modal-title">操作メニュー</div>
    <button class="modal-btn" id="btn-scan" onclick="runScanEmails()">
      <span>📧</span><span>メールをスキャンしてURLを取得</span>
    </button>
    <button class="modal-close" onclick="closeSettings()">閉じる</button>
  </div>
</div>

<script>
// 2026-11-24〜 GitHub Pages 版。データは GAS（API）から人ごとの合言葉で読み書きする
// 合言葉はページに書かない: 最初に URL の #k=… で開くと、この端末に覚える（以後は #k なしでも開ける）
var API = 'https://script.google.com/macros/s/AKfycbzFod4vfUaqKfvc49ljUaTSXSIWXTmK2Z07UitNwAsaZA9uGWj-BcydXVP-o2i7PrF1/exec';
var K = (function () {
  var m = location.hash.match(/k=([^&]+)/);
  try {
    // アドレス欄の #k は消さない（iPhone のホーム画面に追加した時もリンクに合言葉が残るように。νカートと同じ）
    if (m) { localStorage.setItem('rakuken_k', m[1]); return m[1]; }
    return localStorage.getItem('rakuken_k') || '';
  } catch (_) { return m ? m[1] : ''; }
})();
function api_(body) {
  if (!K) return Promise.reject(new Error('合言葉付きのリンクで一度開いてください'));
  body.appKey = K;
  // Content-Type を付けない（単純な送信にして事前確認の通信を起こさない）
  var once = function () {
    return fetch(API, { method: 'POST', body: JSON.stringify(body) })
      .then(function (r) { if (!r.ok) throw new Error('通信エラー ' + r.status); return r.json(); });
  };
  // GAS は時々 404 やエラー画面を返すので、通信の失敗だけ最大4回まで送り直す（どの操作も2回送って同じ結果）
  var tryN = function (n) {
    return once().catch(function (e) {
      if (n >= 4) throw new Error('通信に失敗しました（' + e.message + '）。↻を押してください');
      return new Promise(function (res) { setTimeout(res, 800 * n); }).then(function () { return tryN(n + 1); });
    });
  };
  return tryN(1).then(function (j) {
    if (j && j.message === 'unauthorized') throw new Error('合言葉が違います。もらったリンクで開き直してください');
    return j;
  });
}

var _vouchers = [];
var _filterAcct = '';

function today0() {
  var d = new Date();
  d.setHours(0,0,0,0);
  return d;
}

function parseExpiry(s) {
  if (!s) return null;
  var d = new Date(String(s).replace(/\//g,'-'));
  d.setHours(0,0,0,0);
  return isNaN(d.getTime()) ? null : d;
}

function daysLeft(expiry) {
  var e = parseExpiry(expiry);
  if (!e) return 9999;
  return Math.round((e - today0()) / 86400000);
}

function barClass(d) {
  if (d <= 7) return 'bar-red';
  if (d <= 30) return 'bar-orange';
  if (d <= 60) return 'bar-yellow';
  return 'bar-gray';
}

function badgeClass(d) {
  if (d <= 7) return 'days-red';
  if (d <= 30) return 'days-orange';
  if (d <= 60) return 'days-yellow';
  return 'days-gray';
}

function badgeText(d) {
  if (d < 0) return '期限切れ';
  if (d === 0) return '本日期限';
  return 'あと' + d + '日';
}

function isNoLink(url) {
  return !url || url.indexOf('/myrakken/email/') !== -1 || url === '' || url === 'undefined';
}

function acctClass(a) {
  if (a === '1') return 'acct-1';
  if (a === '2') return 'acct-2';
  if (a === '3') return 'acct-3';
  if (a === '4') return 'acct-4';
  return 'acct-other';
}

function sectionKey(v) {
  var d = daysLeft(v.expiry);
  var e = parseExpiry(v.expiry);
  if (d < 0) return '00_expired';
  if (d <= 7) return '01_week';
  if (d <= 30) return '02_month';
  if (!e) return '99_other';
  var ym = e.getFullYear() * 100 + (e.getMonth() + 1);
  return '10_' + ym;
}

function sectionTitle(key) {
  if (key === '00_expired') return '⚠️ 期限切れ';
  if (key === '01_week') return '🔴 残り7日以内';
  if (key === '02_month') return '⚡ 残り30日以内';
  if (key === '99_other') return 'その他';
  var ym = parseInt(key.slice(3));
  return '📅 ' + Math.floor(ym/100) + '年' + (ym%100) + '月';
}

function makeEl(tag, cls) {
  var el = document.createElement(tag);
  if (cls) el.className = cls;
  return el;
}

function makeCard(v, idx) {
  var d = daysLeft(v.expiry);
  var noLink = isNoLink(v.url);
  var acct = String(v.account || '').trim();

  var card = makeEl('div', v.used ? 'card used' : 'card');
  card.dataset.brand = v.brand;
  card.dataset.acct = acct;
  card.dataset.used = v.used ? '1' : '0';

  var inner = makeEl('div', 'card-inner');
  var bar = makeEl('div', 'card-left-bar ' + (v.used ? 'bar-gray' : barClass(d)));
  inner.appendChild(bar);

  var info = makeEl('div', 'card-left-info');

  var brandRow = makeEl('div', 'brand-row');
  var brandEl = makeEl('span', 'brand');
  brandEl.textContent = v.brand;
  brandRow.appendChild(brandEl);

  if (acct) {
    var acctEl = makeEl('span', 'acct-badge ' + acctClass(acct));
    acctEl.textContent = acct;
    brandRow.appendChild(acctEl);
  }
  if (!v.used && noLink) {
    var nlEl = makeEl('span', 'no-link-badge');
    nlEl.textContent = 'リンク未取得';
    brandRow.appendChild(nlEl);
  }
  info.appendChild(brandRow);

  var amtRow = makeEl('div', 'amount-row');
  var amtEl = makeEl('span', 'amount');
  amtEl.textContent = Number(v.amount).toLocaleString();
  var yenEl = makeEl('span', 'yen');
  yenEl.textContent = '円';
  amtRow.appendChild(amtEl);
  amtRow.appendChild(yenEl);
  info.appendChild(amtRow);

  if (v.expiry) {
    var expRow = makeEl('div', 'expiry-row');
    var expDate = makeEl('span', 'expiry-date');
    expDate.textContent = v.expiry;
    expRow.appendChild(expDate);
    if (!v.used) {
      var daysBadge = makeEl('span', 'days-badge ' + badgeClass(d));
      daysBadge.textContent = badgeText(d);
      expRow.appendChild(daysBadge);
    }
    info.appendChild(expRow);
  }

  inner.appendChild(info);
  card.appendChild(inner);

  var actions = makeEl('div', 'card-actions');

  if (v.used) {
    var btnUsed = makeEl('button', 'btn-use');
    btnUsed.textContent = '✓ 使用済み';
    btnUsed.disabled = true;
    actions.appendChild(btnUsed);
    var btnUndo = makeEl('button', 'btn-undo');
    btnUndo.textContent = '↩ 戻す';
    btnUndo.onclick = (function(url, b) { return function() { markUnused(url, b); }; })(v.url, btnUndo);
    actions.appendChild(btnUndo);
  } else if (noLink) {
    var btnNoLink = makeEl('button', 'btn-nolink');
    btnNoLink.textContent = '📧 楽天で確認';
    btnNoLink.onclick = (function(url) { return function() { if (url && url !== 'undefined') window.open(url, '_blank'); else showToast('URLが設定されていません'); }; })(v.url);
    actions.appendChild(btnNoLink);
    var btnDone2 = makeEl('button', 'btn-done');
    btnDone2.textContent = '✓ 使った';
    btnDone2.onclick = (function(url, btn) { return function() { markUsed(url, btn); }; })(v.url, btnDone2);
    actions.appendChild(btnDone2);
  } else {
    var btnUse = makeEl('button', 'btn-use');
    btnUse.textContent = '🎫 楽券を使う';
    btnUse.onclick = (function(url) { return function() { openVoucher(url); }; })(v.url);
    actions.appendChild(btnUse);
    var btnDone = makeEl('button', 'btn-done');
    btnDone.textContent = '✓ 使った';
    btnDone.onclick = (function(url, btn) { return function() { markUsed(url, btn); }; })(v.url, btnDone);
    actions.appendChild(btnDone);
  }

  card.appendChild(actions);
  return card;
}

function setFilter(chip) {
  document.querySelectorAll('.filter-chip').forEach(function(c) { c.classList.remove('active'); });
  chip.classList.add('active');
  _filterAcct = chip.dataset.acct;
  applyFilters();
}

function applyFilters() {
  var q = document.getElementById('search-input').value.trim();
  var cards = document.querySelectorAll('#list .card');
  cards.forEach(function(card) {
    var brand = card.dataset.brand || '';
    var acct = card.dataset.acct || '';
    var matchSearch = q === '' || brand.indexOf(q) !== -1;
    var matchAcct = _filterAcct === '' || acct === _filterAcct;
    card.style.display = (matchSearch && matchAcct) ? '' : 'none';
  });

  var listEl = document.getElementById('list');
  var children = listEl.children;
  for (var i = 0; i < children.length; i++) {
    var cls = children[i].className;
    if (cls !== 'section-label' && cls !== 'section-label-used') continue;
    var hasVisible = false;
    for (var j = i + 1; j < children.length; j++) {
      var jcls = children[j].className;
      if (jcls === 'section-label' || jcls === 'section-label-used') break;
      if ((children[j].classList.contains('card')) && children[j].style.display !== 'none') {
        hasVisible = true;
        break;
      }
    }
    children[i].style.display = hasVisible ? '' : 'none';
  }
}

function renderVouchers(vouchers) {
  _vouchers = vouchers;
  var active = vouchers.filter(function(v) { return !v.used; });
  var c30 = 0, c60 = 0, total = 0;
  active.forEach(function(v) {
    var d = daysLeft(v.expiry);
    if (d <= 30) c30++;
    if (d <= 60) c60++;
    total += Number(v.amount) || 0;
  });

  document.getElementById('sum-30').textContent = c30;
  document.getElementById('sum-60').textContent = c60;
  document.getElementById('sum-total').textContent = active.length;
  document.getElementById('sum-amount').textContent = '¥' + total.toLocaleString();
  document.getElementById('total-badge').textContent = active.length + '枚';

  var now = new Date();
  document.getElementById('subtitle').textContent =
    now.getFullYear() + '/' + String(now.getMonth()+1).padStart(2,'0') + '/' + String(now.getDate()).padStart(2,'0') + ' 現在';

  var sorted = vouchers.slice().sort(function(a, b) {
    if (a.used !== b.used) return a.used ? 1 : -1;
    var da = parseExpiry(a.expiry) || new Date(9999,0,1);
    var db = parseExpiry(b.expiry) || new Date(9999,0,1);
    if (da - db !== 0) return da - db;
    return String(a.brand).localeCompare(String(b.brand), 'ja');
  });

  var list = document.getElementById('list');
  while (list.firstChild) list.removeChild(list.firstChild);

  // 未使用アイテム（セクション分け）
  var lastSection = null;
  var hasActive = false;
  sorted.forEach(function(v) {
    if (v.used) return;
    hasActive = true;
    var sec = sectionKey(v);
    if (sec !== lastSection) {
      lastSection = sec;
      var lbl = makeEl('div', 'section-label');
      lbl.textContent = sectionTitle(sec);
      list.appendChild(lbl);
    }
    list.appendChild(makeCard(v));
  });

  if (!hasActive) {
    var empty = makeEl('div', 'loading');
    empty.textContent = '未使用の楽券はありません';
    list.appendChild(empty);
  }

  // 使用済みアイテム（グレーアウト表示）
  var usedItems = sorted.filter(function(v) { return v.used; });
  if (usedItems.length > 0) {
    var usedLbl = makeEl('div', 'section-label-used');
    usedLbl.textContent = '✓ 使用済み（シートで手動削除してください）';
    list.appendChild(usedLbl);
    usedItems.forEach(function(v) {
      list.appendChild(makeCard(v));
    });
  }

  applyFilters();
}

function openVoucher(url) {
  if (!url || url === '' || url === 'undefined') { showToast('URLが設定されていません'); return; }
  window.open(url, '_blank');
}

function markUsed(url, btn) {
  var v = _vouchers.find(function(x) { return x.url === url; });
  if (!v) return;
  btn.disabled = true;
  btn.textContent = '送信中…';
  api_({ action: 'appMarkUsed', url: url })
    .then(function(result) {
      if (result && result.status === 'ok') {
        v.used = true;
        renderVouchers(_vouchers);
        showToast('使用済みにしました（シートもグレーになります）');
      } else {
        btn.disabled = false;
        btn.textContent = '✓ 使った';
        showToast('更新に失敗しました');
      }
    })
    .catch(function(err) {
      btn.disabled = false;
      btn.textContent = '✓ 使った';
      showToast(err && err.message ? err.message : 'エラーが発生しました');
    });
}

function markUnused(url, btn) {
  var v = _vouchers.find(function(x) { return x.url === url; });
  if (!v) return;
  btn.disabled = true;
  btn.textContent = '戻し中…';
  api_({ action: 'appMarkUnused', url: url })
    .then(function(result) {
      if (result && result.status === 'ok') {
        v.used = false;
        renderVouchers(_vouchers);
        showToast('未使用に戻しました');
      } else {
        btn.disabled = false;
        btn.textContent = '↩ 戻す';
        showToast('元に戻せませんでした');
      }
    })
    .catch(function(err) {
      btn.disabled = false;
      btn.textContent = '↩ 戻す';
      showToast(err && err.message ? err.message : 'エラーが発生しました');
    });
}

function loadVouchers() {
  var list = document.getElementById('list');
  while (list.firstChild) list.removeChild(list.firstChild);
  var loading = document.createElement('div');
  loading.className = 'loading';
  loading.textContent = '読み込み中…';
  list.appendChild(loading);
  document.getElementById('search-input').value = '';

  api_({ action: 'appList' })
    .then(function(j) {
      if (!j || j.status !== 'ok') throw new Error((j && j.message) || '読み込みに失敗しました');
      renderVouchers(j.vouchers || []);
    })
    .catch(function(err) {
      loading.textContent = err && err.message ? err.message : '読み込みに失敗しました';
      showToast('エラー: ' + (err && err.message ? err.message : String(err)));
    });
}

function openSettings() {
  document.getElementById('modal-overlay').classList.add('show');
}

function closeSettings(e) {
  if (!e || e.target === document.getElementById('modal-overlay')) {
    document.getElementById('modal-overlay').classList.remove('show');
  }
}

function runScanEmails() {
  var btn = document.getElementById('btn-scan');
  var label = btn.querySelector('span:last-child');
  btn.disabled = true;
  label.textContent = 'スキャン中…';
  api_({ action: 'appScanEmails' })
    .then(function(result) {
      btn.disabled = false;
      label.textContent = 'メールをスキャンしてURLを取得';
      closeSettings();
      var n = (result && result.updated != null) ? result.updated : '?';
      showToast(n + '件のURLを更新しました');
      if (result && result.updated > 0) loadVouchers();
    })
    .catch(function() {
      btn.disabled = false;
      label.textContent = 'メールをスキャンしてURLを取得';
      showToast('スキャンに失敗しました');
    });
}

function showToast(msg) {
  var t = document.getElementById('toast');
  document.getElementById('toast-msg').textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(function() { t.classList.remove('show'); }, 2500);
}

window.onload = loadVouchers;
</script>

</body>
</html>
